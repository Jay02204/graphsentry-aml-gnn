version: "3.8"

services:
  graphsentry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphsentry-aml-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DECISION_THRESHOLD=0.45
      - FOCAL_GAMMA=2.0
      - FOCAL_ALPHA=0.85
      - NUM_NEIGHBORS=[15, 10]
      - TRAIN_BATCH_SIZE=512
    volumes:
      - ./artifacts:/app/artifacts
      - ./data/processed:/app/data/processed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    resources:
      limits:
        cpus: '4.0'
        memory: 4096M
      reservations:
        memory: 1024M
